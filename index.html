<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail - Wegwerf-E-Mail & Posteingang</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">⚡ Echte Wegwerf-Mail</h1>
            <span class="text-xs bg-green-600 text-white px-2.5 py-1 rounded-full">Live auf GitHub Pages</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center max-w-xl text-center">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700 w-full">
            <h2 class="text-2xl font-semibold mb-2">Ihre temporäre E-Mail-Adresse</h2>
            <p class="text-gray-400 text-sm mb-6">Empfangen Sie hier echte E-Mails und Registrierungscodes.</p>

            <!-- E-Mail Input & Copy Button -->
            <div class="flex flex-col sm:flex-row gap-2 mb-6">
                <input type="text" id="email-box" readonly value="Erstelle Adresse..." 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-center text-blue-300 font-mono text-sm sm:text-base focus:outline-none">
                <button onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-lg transition duration-200 shadow-lg">
                    Kopieren
                </button>
            </div>
            <div id="copy-alert" class="text-green-400 text-sm mb-4 hidden">In die Zwischenablage kopiert!</div>

            <!-- Posteingang Sektion -->
            <div class="border-t border-gray-700 pt-6 text-left">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-medium">Posteingang</h3>
                    <button onclick="checkInbox()" class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-white font-medium">Postfach prüfen</button>
                </div>
                <div id="inbox" class="bg-gray-900 rounded-lg p-4 text-gray-400 text-sm border border-gray-800 min-h-[120px] flex flex-col items-center justify-center">
                    Warte auf E-Mails... (Klicke auf "Postfach prüfen")
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-xs text-gray-500">
        Gehostet über GitHub Pages &bull; Echte API Anbindung
    </footer>

    <!-- JavaScript Logik mit echter API -->
    <script>
        let currentEmail = "";
        let login = "";
        let domain = "";

        // Echte E-Mail-Adresse beim Laden der Seite generieren
        async function generateEmail() {
            try {
                const response = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
                const data = await response.json();
                currentEmail = data[0];
                document.getElementById("email-box").value = currentEmail;
                
                // Login und Domain für Postfach-Abfragen trennen
                const parts = currentEmail.split('@');
                login = parts[0];
                domain = parts[1];
                
                checkInbox();
            } catch (error) {
                document.getElementById("email-box").value = "Fehler beim Laden der Adresse";
            }
        }

        // Kopieren-Funktion
        function copyEmail() {
            navigator.clipboard.writeText(currentEmail);
            const alertBox = document.getElementById("copy-alert");
            alertBox.classList.remove("hidden");
            setTimeout(() => alertBox.classList.add("hidden"), 2000);
        }

        // Posteingang auf neue Nachrichten prüfen
        async function checkInbox() {
            if (!login || !domain) return;
            const inboxDiv = document.getElementById("inbox");
            inboxDiv.innerHTML = "Prüfe Posteingang...";

            try {
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`);
                const messages = await response.json();

                if (messages.length === 0) {
                    inboxDiv.innerHTML = "Posteingang ist leer. Klicke auf 'Postfach prüfen' zum Aktualisieren.";
                } else {
                    let html = '<ul class="w-full space-y-2">';
                    for (let msg of messages) {
                        html += `<li class="bg-gray-800 p-2.5 rounded border border-gray-700 cursor-pointer hover:bg-gray-700 transition" onclick="readMessage(${msg.id})">
                            <div class="text-xs text-blue-400">Von: ${msg.from}</div>
                            <div class="font-medium text-white">${msg.subject}</div>
                        </li>`;
                    }
                    html += '</ul>';
                    inboxDiv.innerHTML = html;
                }
            } catch (error) {
                inboxDiv.innerHTML = "Fehler beim Abrufen der E-Mails.";
            }
        }

        // Einzelne Nachricht lesen
        async function readMessage(id) {
            const inboxDiv = document.getElementById("inbox");
            inboxDiv.innerHTML = "Lade Nachricht...";
            try {
                const response = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${id}`);
                const msg = await response.json();
                inboxDiv.innerHTML = `
                    <div class="w-full text-left">
                        <button onclick="checkInbox()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2.5 py-1 rounded mb-3 text-white">&larr; Zurück zum Posteingang</button>
                        <p class="text-xs text-gray-400"><strong>Von:</strong> ${msg.from}</p>
                        <p class="text-sm font-bold text-white mb-2"><strong>Betreff:</strong> ${msg.subject}</p>
                        <div class="text-gray-200 bg-gray-950 p-3 rounded text-xs overflow-auto max-h-40 border border-gray-800">${msg.textBody || msg.htmlBody}</div>
                    </div>
                `;
            } catch (error) {
                inboxDiv.innerHTML = "Fehler beim Lesen der Nachricht.";
            }
        }

        // Start beim Laden
        window.onload = generateEmail;
    </script>
</body>
</html>
