<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail Verify - Wegwerf-E-Mail</title>
    <!-- Tailwind CSS für modernes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">⚡ Temp-Mail-Verify</h1>
            <span class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded-full">GitHub Pages Live</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center max-w-xl text-center">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-xl border border-gray-700 w-full">
            <h2 class="text-2xl font-semibold mb-2">Ihre temporäre E-Mail-Adresse</h2>
            <p class="text-gray-400 text-sm mb-6">Perfekt für Registrierungen, um Spam im Postfach zu vermeiden.</p>

            <!-- E-Mail Input & Copy Button -->
            <div class="flex flex-col sm:flex-row gap-2 mb-6">
                <input type="text" id="email-box" readonly value="Lade Adresse..." 
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-center text-blue-300 font-mono text-lg focus:outline-none">
                <button onclick="copyEmail()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-lg transition duration-200 shadow-lg">
                    Kopieren
                </button>
            </div>

            <div id="copy-alert" class="text-green-400 text-sm mb-4 hidden">In die Zwischenablage kopiert!</div>

            <!-- Posteingang Sektion -->
            <div class="border-t border-gray-700 pt-6 text-left">
                <h3 class="text-lg font-medium mb-3 flex justify-between items-center">
                    <span>Posteingang</span>
                    <button onclick="checkInbox()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-gray-300">Aktualisieren</button>
                </h3>
                <div id="inbox" class="bg-gray-900 rounded-lg p-4 text-gray-500 text-sm text-center border border-gray-800 min-h-[100px] flex items-center justify-center">
                    Ihr Posteingang ist leer. Warter auf E-Mails...
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-xs text-gray-500">
        Gehostet über GitHub Pages &bull; Open Source
    </footer>

    <!-- JavaScript Logik -->
    <script>
        // Beispiel-Funktion zum Kopieren
        function copyEmail() {
            const copyText = document.getElementById("email-box");
            navigator.clipboard.writeText(copyText.value);
            const alertBox = document.getElementById("copy-alert");
            alertBox.classList.remove("hidden");
            setTimeout(() => alertBox.classList.add("hidden"), 2000);
        }

        // Hier können Sie später API-Anfragen einbinden
        function checkInbox() {
            alert("Posteingang wird aktualisiert...");
        }

        // Dummy-Generierung zum Testen der UI
        window.onload = function() {
            setTimeout(() => {
                document.getElementById("email-box").value = "user_" + Math.random().toString(36).substring(7) + "@temp-mail.org";
            }, 1000);
        };
    </script>
</body>
</html>
